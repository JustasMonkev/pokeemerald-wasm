<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pokeemerald-wasm</title>
  <link rel="stylesheet" href="/web/style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-25RQ7HFHXS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-25RQ7HFHXS');
  </script>
</head>
<body>
  <main class="shell" aria-label="pokeemerald-wasm emulator">
    <header class="masthead">
      <h1>pokeemerald-wasm</h1>
      <a class="github-link" href="https://github.com/tripplyons/pokeemerald-wasm" target="_blank" rel="noreferrer" aria-label="Open pokeemerald-wasm on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.3-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.6 4.7 18.6 5 18.6 5c.6 1.6.2 2.9.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z" />
        </svg>
        <span>tripplyons</span>
      </a>
    </header>

    <section class="display-panel" aria-label="Game display">
      <canvas id="screen" width="240" height="160" aria-label="Game screen"></canvas>
    </section>

    <div class="status" id="status">loading wasm…</div>

    <section class="controls" aria-label="Controls">
      <div class="dpad" aria-label="Directional pad">
        <button data-key="up" aria-label="Up">↑</button>
        <button data-key="left" aria-label="Left">←</button>
        <button data-key="right" aria-label="Right">→</button>
        <button data-key="down" aria-label="Down">↓</button>
      </div>

      <div class="face" aria-label="Action buttons">
        <button data-key="b">B</button>
        <button data-key="a">A</button>
        <button data-key="select">SELECT</button>
        <button data-key="start">START</button>
      </div>

      <div class="speed-control" aria-label="Speed controls">
        <div class="speed-heading">Speed <output id="speed-value">1x</output></div>
        <div class="speed-buttons">
          <button type="button" data-speed="0.5">0.5x</button>
          <button type="button" data-speed="2">2x</button>
          <button type="button" data-speed="1">Reset</button>
          <button type="button" data-speed="unlimited">Unlimited</button>
        </div>
      </div>

      <div class="utility-controls" aria-label="Save and display controls">
        <button id="download-save" type="button">Download .sav</button>
        <label class="upload-save" for="upload-save">Upload .sav</label>
        <button id="fullscreen" type="button">Big Picture</button>
        <input id="upload-save" type="file" accept=".sav,.srm,application/octet-stream" />
      </div>

      <button id="cheat-open" class="cheat-open" type="button">Cheats</button>
    </section>

    <p class="keys">Keyboard: arrows, Z=A, X=B, Enter=Start, Shift=Select.</p>
  </main>

  <dialog id="cheat-dialog" class="cheat-dialog" aria-labelledby="cheat-title">
    <div class="cheat-shell">
      <header class="cheat-header">
        <h2 id="cheat-title">Cheats</h2>
        <button id="cheat-close" class="cheat-close" type="button" aria-label="Close cheats">Close</button>
      </header>

      <p id="cheat-message" class="cheat-message" role="status">Loading options…</p>

      <section class="cheat-section" aria-labelledby="cheat-pokemon-title">
        <h3 id="cheat-pokemon-title">Get Pokémon</h3>
        <label for="cheat-pokemon">Pokémon</label>
        <input id="cheat-pokemon" list="cheat-species-options" autocomplete="off" placeholder="Rayquaza" />

        <div class="cheat-grid">
          <label for="cheat-move-1">Move 1<input id="cheat-move-1" class="cheat-move" list="cheat-move-options" autocomplete="off" placeholder="Dragon Claw" /></label>
          <label for="cheat-move-2">Move 2<input id="cheat-move-2" class="cheat-move" list="cheat-move-options" autocomplete="off" placeholder="Earthquake" /></label>
          <label for="cheat-move-3">Move 3<input id="cheat-move-3" class="cheat-move" list="cheat-move-options" autocomplete="off" placeholder="Flamethrower" /></label>
          <label for="cheat-move-4">Move 4<input id="cheat-move-4" class="cheat-move" list="cheat-move-options" autocomplete="off" placeholder="Thunderbolt" /></label>
        </div>

        <label for="cheat-party-slot">Party slot</label>
        <select id="cheat-party-slot">
          <option value="">Next empty</option>
          <option value="0">Replace slot 1</option>
          <option value="1">Replace slot 2</option>
          <option value="2">Replace slot 3</option>
          <option value="3">Replace slot 4</option>
          <option value="4">Replace slot 5</option>
          <option value="5">Replace slot 6</option>
        </select>

        <button id="cheat-add-pokemon" class="cheat-action" type="button" disabled>Get level 100 Pokémon</button>
      </section>

      <section class="cheat-section" aria-labelledby="cheat-item-title">
        <h3 id="cheat-item-title">Get Item</h3>
        <label for="cheat-item">Item</label>
        <input id="cheat-item" list="cheat-item-options" autocomplete="off" placeholder="Master Ball" />

        <label for="cheat-item-count">Quantity</label>
        <input id="cheat-item-count" type="number" min="1" max="99" value="1" />

        <button id="cheat-add-item" class="cheat-action" type="button" disabled>Get item</button>
      </section>
    </div>
  </dialog>

  <datalist id="cheat-species-options"></datalist>
  <datalist id="cheat-move-options"></datalist>
  <datalist id="cheat-item-options"></datalist>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
